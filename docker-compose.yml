services:
  core:
    build: .
    command: ["uvicorn", "core_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CORE_DB_PATH: /data/core.db
    volumes:
      - mineguard_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      CORE_URL: http://core:8000
    depends_on:
      - core
    ports:
      - "8501:8501"
    restart: unless-stopped

  digital-twin:
    build: .
    command: ["streamlit", "run", "digital_twin_app.py", "--server.address", "0.0.0.0", "--server.port", "8502", "--server.headless", "true"]
    environment:
      CORE_URL: http://core:8000
    depends_on:
      - core
    ports:
      - "8502:8502"
    restart: unless-stopped

volumes:
  mineguard_data:
